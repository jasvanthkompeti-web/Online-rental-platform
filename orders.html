<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Rentals - RentX</title><link rel="stylesheet" href="style.css"></head>
<body><nav><a class="logo" href="/">RentX</a><a href="/">Home</a></nav><main class="section"><h1>My Rentals</h1><div class="lookup"><input id="email" type="email" placeholder="Enter booking email"><button class="btn" onclick="loadOrders()">Find My Rentals</button></div><div id="list"></div></main>
<script>
async function loadOrders(){let e=email.value.trim();let r=await fetch('/api/orders/customer?email='+encodeURIComponent(e));let d=await r.json();
list.innerHTML=d.length?d.map(o=>`<div class="order-card"><div><b>Invoice RX-${String(o.id).padStart(6,'0')}</b><p>${o.startDate} → ${o.endDate} • ${o.days} day(s)</p><p>Status: <strong>${o.status}</strong> • Payment: ${o.paymentStatus}</p></div><div><strong>₹${o.grandTotal}</strong><br><a href="invoice.html?id=${o.id}">View Bill</a> ${o.status==='CONFIRMED'?`<button onclick="cancelOrder(${o.id})">Cancel</button>`:''}</div></div>`).join(''):'<p>No rentals found.</p>'}
async function cancelOrder(id){if(!confirm('Cancel this rental?'))return;await fetch('/api/orders/'+id+'/cancel',{method:'PUT'});loadOrders()}
</script></body></html>
